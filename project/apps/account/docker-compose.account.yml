version: '3.9'
services:
  readme.account.mongo:
    image: mongo:4.4
    restart: always
    container_name: readme.account.mongo
    env_file:
      - .readme.account.mongodb.env
    volumes:
      - readme.account.volume:/data/db
    networks:
      - readme.account.network
    ports:
      - "27017:27017"

  readme.account:
    container_name: readme.account
    depends_on:
      - readme.account.mongo
    restart: always
    image: readme.account:1.0.0
    env_file:
      - .readme.account.env
    ports:
      - "3333:3333"
    networks:
      - readme.account.network

volumes:
  readme.account.volume:

networks:
  readme.account.network:
    driver: bridge
